<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts | </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-bar">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./projects.html">Projects</a></li>
                <li><a href="./skills.html">Skills</a></li>
                <li><a href="./contacts.html">Contacts</a></li>
            </ul>
        </div>
        <h1>Get In Touch</h1>
        <p>We'd love to hear from you</p>
    </header>

    <main>
        <section id="contact">
            <h2>Contact Details</h2>
            <ul>
                <li>Email: company.email@gmail.com</li>
                <li>GitHub: github.com/company</li>
                <li>LinkedIn: linkedin.com/in/company</li>
                <li>Location: Kathmandu, Nepal</li>
            </ul>
        </section>

        <section id="contact-form">
            <h2>Send a Message</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Adhisofiya.email@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
            </div>
            <button type="button" class="submit-btn">Send Message</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Company. All rights reserved.</p>
    </footer>
</body>
</html>
